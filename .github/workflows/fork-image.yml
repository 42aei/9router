# Fork-only builds on tags v<upstream version>-42aei.<n>.
name: Fork Image

on:
  push:
    tags:
      - "v*-42aei.*"

permissions:
  contents: read

concurrency:
  group: fork-image-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/42aei/9router

jobs:
  prepare:
    name: Validate tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    outputs:
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Validate fork release tag
        id: release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          re='^v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-42aei\.[1-9][0-9]*)$'
          if [[ ! "$TAG" =~ $re ]]; then
            echo "Expected a tag like v0.5.104-42aei.1, received: $TAG" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          echo "$version"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            suffix: arm64
            runner: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push platform image by digest
        id: build
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: APP_VERSION=${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          provenance: false
          sbom: false

      - name: Smoke-test platform image before publishing digest artifact
        env:
          IMAGE: ${{ env.IMAGE }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          set -Eeuo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

          container="9router-platform-smoke-${GITHUB_RUN_ID}-${SUFFIX}"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT

          docker run --detach \
            --name "$container" \
            --platform "$PLATFORM" \
            --publish 20128:20128 \
            "${IMAGE}@${IMAGE_DIGEST}"

          for attempt in {1..45}; do
            if curl --fail --silent --show-error http://127.0.0.1:20128/api/health; then
              echo "${PLATFORM} health check passed"
              exit 0
            fi
            if (( attempt % 5 == 0 )); then
              echo "Waiting for ${PLATFORM} health check (${attempt}/45)" >&2
            fi
            sleep 2
          done

          echo "${PLATFORM} health check failed; container logs follow:" >&2
          docker logs "$container" || true
          exit 1

      - name: Save image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          test -n "$IMAGE_DIGEST"
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$IMAGE_DIGEST" > "$RUNNER_TEMP/digests/${SUFFIX}.txt"

      - name: Upload image digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ matrix.suffix }}
          path: ${{ runner.temp }}/digests/${{ matrix.suffix }}.txt
          if-no-files-found: error

  publish:
    name: Publish and verify manifest
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download platform digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and verify version manifest
        env:
          IMAGE: ${{ env.IMAGE }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          digest_files=("$RUNNER_TEMP"/digests/*.txt)

          if [[ "${#digest_files[@]}" -ne 2 ]]; then
            echo "Expected two platform digests, found ${#digest_files[@]}" >&2
            exit 1
          fi

          sources=()
          for digest_file in "${digest_files[@]}"; do
            digest="$(tr -d '\n' < "$digest_file")"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Invalid image digest in $digest_file: $digest" >&2
              exit 1
            fi
            sources+=("${IMAGE}@${digest}")
          done

          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" \
            "${sources[@]}"

          docker buildx imagetools inspect "${IMAGE}:${VERSION}" | tee "$RUNNER_TEMP/version-manifest.txt"
          docker buildx imagetools inspect --raw "${IMAGE}:${VERSION}" > "$RUNNER_TEMP/version-manifest.json"

          expected=$'linux/amd64\nlinux/arm64'
          actual="$(jq -r '[.manifests[] | select(.platform != null and .platform.os != null and .platform.architecture != null) | "\(.platform.os)/\(.platform.architecture)"] | sort | .[]' "$RUNNER_TEMP/version-manifest.json")"
          if [[ "$actual" != "$expected" ]]; then
            echo "Version manifest platforms do not match exactly:" >&2
            printf '%s\n' "$actual" >&2
            exit 1
          fi

      - name: Smoke-test resolved version manifest
        env:
          IMAGE: ${{ env.IMAGE }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -Eeuo pipefail
          container="9router-manifest-smoke-${GITHUB_RUN_ID}"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT

          docker run --detach \
            --name "$container" \
            --platform linux/amd64 \
            --publish 20128:20128 \
            "${IMAGE}:${VERSION}"

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:20128/api/health; then
              echo "Resolved version manifest health check passed"
              exit 0
            fi
            if (( attempt % 5 == 0 )); then
              echo "Waiting for resolved manifest health check (${attempt}/30)" >&2
            fi
            sleep 2
          done

          echo "Resolved version manifest health check failed; container logs follow:" >&2
          docker logs "$container" || true
          exit 1
